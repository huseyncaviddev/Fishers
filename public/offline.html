<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fishers — Oflayn</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0c2340;
        color: rgba(255,255,255,0.85);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; letter-spacing: 0.08em; text-transform: uppercase; }
      p { max-width: 32rem; line-height: 1.6; color: rgba(255,255,255,0.6); }
      button {
        margin-top: 1.5rem;
        padding: 0.7rem 1.4rem;
        border-radius: 9999px;
        border: 1px solid rgba(255,255,255,0.2);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: rgba(255,255,255,0.08); }
    </style>
  </head>
  <body>
    <main>
      <h1>Fishers</h1>
      <p>İnternet bağlantısı yoxdur. Öncədən yüklənmiş məzmun mövcud olduğu qədər əlçatandır. Bağlantı bərpa olunanda səhifə avtomatik yenilənəcək.</p>
      <button onclick="location.reload()">Yenidən Cəhd Et</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
